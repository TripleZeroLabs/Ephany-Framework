components:
  schemas:
    AreaUnitEnum:
      enum:
      - sq_m
      - sq_ft
      type: string
      description: |-
        * `sq_m` - Square Meters (m²)
        * `sq_ft` - Square Feet (ft²)
    Asset:
      type: object
      description: |-
        Primary serializer for Asset instances.
        Handles unit conversion (metric/imperial) based on user settings.
      properties:
        id:
          type: integer
          readOnly: true
        type_id:
          type: string
          maxLength: 100
        manufacturer:
          allOf:
          - $ref: '#/components/schemas/Manufacturer'
          readOnly: true
        manufacturer_name:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/AssetCategory'
          readOnly: true
        category_name:
          type: string
          readOnly: true
        model:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        url:
          title: Product URL
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        catalog_img:
          type: string
          format: uri
          nullable: true
        overall_height:
          type: number
          format: double
          nullable: true
        overall_width:
          type: number
          format: double
          nullable: true
        overall_depth:
          type: number
          format: double
          nullable: true
        custom_fields:
          nullable: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/AssetFile'
          readOnly: true
        components:
          type: array
          items:
            $ref: '#/components/schemas/AssetComponent'
          readOnly: true
      required:
      - category
      - category_name
      - components
      - files
      - id
      - manufacturer
      - manufacturer_name
      - model
      - name
      - type_id
    AssetAttribute:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Key name. Must be lowercase, use underscores, and have no special
            characters (e.g., 'material_finish').
          maxLength: 50
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          description: |-
            Determines if this field appears on the generic Catalog definition or the specific Project Instance.

            * `type` - Asset Type (Catalog)
            * `instance` - Asset Instance (Project)
            * `both` - Both
        data_type:
          allOf:
          - $ref: '#/components/schemas/DataTypeEnum'
          description: |-
            Enforce a specific data type for this attribute.

            * `str` - Text
            * `int` - Whole Number
            * `float` - Decimal
            * `bool` - Yes / No
            * `choice` - Picklist (Single)
            * `multi_choice` - Picklist (Multiple)
        unit_type:
          allOf:
          - $ref: '#/components/schemas/UnitTypeEnum'
          description: |-
            Revit SpecTypeId for unit conversion.

            * `none` - No Unit (Text/Bool/Int)
            * `autodesk.spec.aec:length-2.0.0` - Length
            * `autodesk.spec.aec:distance-1.0.0` - Distance
            * `autodesk.spec.aec:area-2.0.0` - Area
            * `autodesk.spec.aec:volume-2.0.0` - Volume
            * `autodesk.spec.aec:mass-2.0.0` - Mass / Weight
            * `autodesk.spec.aec:massDensity-2.0.0` - Density
            * `autodesk.spec.aec:angle-2.0.0` - Angle
            * `autodesk.spec.aec:slope-2.0.0` - Slope
            * `autodesk.spec.aec:number-2.0.0` - Number (Unitless)
        choices:
          type: array
          items:
            $ref: '#/components/schemas/AssetAttributeChoice'
          readOnly: true
      required:
      - choices
      - id
      - name
    AssetAttributeChoice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        value:
          type: string
          title: Choice Value
          description: Allowed value for this attribute. Must be unique within this
            attribute.
          maxLength: 255
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Display order of this choice in the picklist (lower numbers
            appear first).
      required:
      - id
      - value
    AssetAttributeChoiceRequest:
      type: object
      properties:
        value:
          type: string
          minLength: 1
          title: Choice Value
          description: Allowed value for this attribute. Must be unique within this
            attribute.
          maxLength: 255
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Display order of this choice in the picklist (lower numbers
            appear first).
      required:
      - value
    AssetAttributeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Key name. Must be lowercase, use underscores, and have no special
            characters (e.g., 'material_finish').
          maxLength: 50
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          description: |-
            Determines if this field appears on the generic Catalog definition or the specific Project Instance.

            * `type` - Asset Type (Catalog)
            * `instance` - Asset Instance (Project)
            * `both` - Both
        data_type:
          allOf:
          - $ref: '#/components/schemas/DataTypeEnum'
          description: |-
            Enforce a specific data type for this attribute.

            * `str` - Text
            * `int` - Whole Number
            * `float` - Decimal
            * `bool` - Yes / No
            * `choice` - Picklist (Single)
            * `multi_choice` - Picklist (Multiple)
        unit_type:
          allOf:
          - $ref: '#/components/schemas/UnitTypeEnum'
          description: |-
            Revit SpecTypeId for unit conversion.

            * `none` - No Unit (Text/Bool/Int)
            * `autodesk.spec.aec:length-2.0.0` - Length
            * `autodesk.spec.aec:distance-1.0.0` - Distance
            * `autodesk.spec.aec:area-2.0.0` - Area
            * `autodesk.spec.aec:volume-2.0.0` - Volume
            * `autodesk.spec.aec:mass-2.0.0` - Mass / Weight
            * `autodesk.spec.aec:massDensity-2.0.0` - Density
            * `autodesk.spec.aec:angle-2.0.0` - Angle
            * `autodesk.spec.aec:slope-2.0.0` - Slope
            * `autodesk.spec.aec:number-2.0.0` - Number (Unitless)
      required:
      - name
    AssetCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - id
      - name
    AssetCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
      required:
      - name
    AssetComponent:
      type: object
      description: Serializer for AssetComponent (through model for assemblies).
      properties:
        id:
          type: integer
          readOnly: true
        child_asset:
          allOf:
          - $ref: '#/components/schemas/NestedAsset'
          readOnly: true
        quantity_required:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Number of this component needed in the assembly
        can_add_per_instance:
          type: boolean
          description: If true, this component can have additional quantities added
            per AssetInstance (project-level).
      required:
      - child_asset
      - id
    AssetComponentInstance:
      type: object
      description: |-
        Serializer for AssetComponentInstance.

        Handles the linking of optional AssetComponents to specific AssetInstances.
        Uses SerializerMethodField for 'asset_component' to prevent circular import
        issues and ensure full nested serialization of the component definition.
      properties:
        id:
          type: integer
          readOnly: true
        asset_component:
          allOf:
          - $ref: '#/components/schemas/AssetComponent'
          readOnly: true
        component_name:
          type: string
          readOnly: true
        component_type_id:
          type: string
          readOnly: true
        component_quantity:
          type: integer
          readOnly: true
        asset_instance_asset_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Quantity of this optional component for this specific instance.
            Defaults to the component's base quantity.
      required:
      - asset_component
      - asset_instance_asset_name
      - component_name
      - component_quantity
      - component_type_id
      - id
    AssetComponentInstanceRequest:
      type: object
      description: |-
        Serializer for AssetComponentInstance.

        Handles the linking of optional AssetComponents to specific AssetInstances.
        Uses SerializerMethodField for 'asset_component' to prevent circular import
        issues and ensure full nested serialization of the component definition.
      properties:

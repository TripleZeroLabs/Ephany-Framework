        description: A search term.
        schema:
          type: string
      - in: query
        name: type_id
        schema:
          type: string
      - in: query
        name: type_id__iexact
        schema:
          type: string
      tags:
      - assets
      security:
      - tokenAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []

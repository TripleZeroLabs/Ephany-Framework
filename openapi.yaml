openapi: 3.0.3
info:
  title: Ephany Framework API
  version: 0.1.0
  description: |-
    Track a standard kit of parts across a fleet of near-identical projects.

    The core chain is **Asset** (catalog definition) -> **Project** -> **Snapshot**
    (a point in time) -> **AssetInstance** (one occurrence of a catalog asset in
    that snapshot). Assets may be assemblies composed of other assets, and both
    assets and instances carry `custom_fields` validated against the
    `AssetAttribute` schema.
paths:
  /api/assets/:
    get:
      operationId: assets_list
      parameters:
      - in: query
        name: category__name
        schema:
          type: string
      - in: query
        name: description
        schema:
          type: string
      - in: query
        name: description__icontains
        schema:
          type: string
      - in: query
        name: manufacturer__name
        schema:
          type: string
      - in: query
        name: manufacturer__name__icontains
        schema:
          type: string
      - in: query
        name: manufacturer__name__iexact
        schema:
          type: string
      - in: query
        name: model
        schema:
          type: string
      - in: query
        name: model__icontains
        schema:
          type: string
      - in: query
        name: model__iexact
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: name__icontains
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type_id
        schema:
          type: string
      - in: query
        name: type_id__iexact
        schema:
          type: string
      tags:
      - assets
      security:
      - tokenAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetList'
          description: ''
    post:
      operationId: assets_create
      tags:
      - assets
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
        required: true
      security:
      - tokenAuth: []
      - ApiKeyAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/:
    get:
      operationId: assets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this asset.
        required: true
      tags:
